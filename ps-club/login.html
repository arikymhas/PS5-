<!doctype html><html lang="ru"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Вход — PlayStation Club</title><link rel="stylesheet" href="css/style.css"/></head><body><div id="appHeader"></div><main class="form-shell"><div class="form-card glass"><span class="eyebrow">PLAYSTATION CLUB</span><h1 class="page-heading" style="margin:10px 0 6px"><span>Войти</span></h1><p class="muted">Управляйте бронированиями и профилем.</p><div id="modeNotice"></div><form id="loginForm" class="form-grid"><div class="field"><label>Email</label><input id="email" type="email" required placeholder="you@example.com"/></div><div class="field"><label>Пароль</label><input id="password" type="password" required minlength="6"/></div><div class="form-actions"><button class="btn btn-primary" type="submit">Войти</button><button class="btn btn-secondary" type="button" id="registerBtn">Создать аккаунт</button><button class="btn btn-ghost" type="button" id="resetBtn">Восстановить пароль</button></div></form><div class="link-row">Можно начать просмотр каталога без авторизации — вход нужен для бронирования.</div></div></main><div id="appFooter"></div><div id="toast" class="toast"></div><script type="module" src="js/login.js"></script></body></html>
